services:
  todo_app:
    build: ./todo_app
    ports:
      - '${APP_PORT:-443}:8000'
    volumes:
      - './todo_app:/app'
    environment:
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}?serverVersion=mariadb-10.3.39
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: 'mariadb:10.3'
    ports:
      - '${DB_PORT:-3906}:3306'
    environment:
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      # Loaded in alphabetical order on the first start: users before todos (foreign key).
      - './db_dump/user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro'
      - './db_dump/todo.sql:/docker-entrypoint-initdb.d/02-todo.sql:ro'
      - 'db_data:/var/lib/mysql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MARIADB_ROOT_PASSWORD}']
      interval: 5s
      retries: 20

volumes:
  db_data:
